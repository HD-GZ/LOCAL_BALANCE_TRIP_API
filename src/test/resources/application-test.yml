spring:
  datasource:
    url: jdbc:h2:mem:lbtrip-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  mail:
    host: localhost
    port: 2525
    username: test
    password: test

app:
  cors:
    allowed-origins:
      - http://localhost:3000
  jwt:
    secret: test-secret-key-that-is-at-least-32-bytes-long
    access-token-expiration: 30m
    refresh-token-expiration: 14d
  mail:
    from: no-reply@test.local
  email-verification:
    code-expiration: 24h
