spring:
  datasource:
    url: jdbc:h2:mem:lbtrip-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  ai:
    openai:
      api-key: test-key
app:
  cors:
    allowed-origins:
      - http://localhost:3000
  storage:
    max-image-size: 10MB
    s3:
      bucket: test-bucket
      region: ap-northeast-2
      access-key: test-access-key
      secret-key: test-secret-key
    cdn-base-url: http://localhost
  jwt:
    secret: test-secret-key-that-is-at-least-32-bytes-long
    access-token-expiration: 30m
    refresh-token-expiration: 14d
    admin-secret: test-admin-secret-key-that-is-at-least-32-bytes
    admin-access-token-expiration: 30m
  mail:
    from: no-reply@test.local
  email-verification:
    code-expiration: 24h

swagger:
  server-url: http://localhost

sendgrid:
  api-key: test-sendgrid-api-key

slack:
  logging:
    error: http://localhost

tour-api:
  base-url: http://localhost
  odii-base-url: http://localhost
  service-key: test-key
  mobile-os: ETC
  mobile-app: lbtrip-test
  read-timeout: 5s
