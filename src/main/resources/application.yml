spring:
  output:
    ansi:
      enabled: ${SPRING_OUTPUT_ANSI_ENABLED:always}
  servlet:
    multipart:
      max-file-size: ${MAX_IMAGE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:11MB}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
  flyway:
    enabled: ${FLYWAY_ENABLED}
    locations: classpath:db/migration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  storage:
    max-image-size: ${MAX_IMAGE_SIZE}
    s3:
      bucket: ${S3_BUCKET}
      region: ${S3_REGION}
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
    cdn-base-url: ${CDN_BASE_URL}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}
    admin-secret: ${JWT_ADMIN_SECRET}
    admin-access-token-expiration: ${JWT_ADMIN_ACCESS_TOKEN_EXPIRATION}
  mail:
    from: ${MAIL_FROM}
  email-verification:
    code-expiration: ${EMAIL_VERIFICATION_CODE_EXPIRATION}

swagger:
  server-url: ${SWAGGER_SERVER_URL}

sendgrid:
  api-key: ${SENDGRID_API_KEY}

slack:
  logging:
    error: ${SLACK_LOGGING_ERROR_URL}

tour-api:
  base-url: https://apis.data.go.kr/B551011/KorService2
  odii-base-url: https://apis.data.go.kr/B551011/Odii
  service-key: ${TOUR_API_SERVICE_KEY}
  mobile-os: ${TOUR_API_MOBILE_OS}
  mobile-app: ${TOUR_API_MOBILE_APP}
  read-timeout: ${TOUR_API_READ_TIMEOUT}
