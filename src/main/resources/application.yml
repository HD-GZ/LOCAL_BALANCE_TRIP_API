spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
  flyway:
    enabled: ${FLYWAY_ENABLED}
    locations: classpath:db/migration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}
    admin-secret: ${JWT_ADMIN_SECRET}
    admin-access-token-expiration: ${JWT_ADMIN_ACCESS_TOKEN_EXPIRATION}
  mail:
    from: ${MAIL_FROM}
  email-verification:
    code-expiration: ${EMAIL_VERIFICATION_CODE_EXPIRATION}

swagger:
  server-url: ${SWAGGER_SERVER_URL}

sendgrid:
  api-key: ${SENDGRID_API_KEY}

tour-api:
  base-url: https://apis.data.go.kr/B551011/KorService2
  odii-base-url: https://apis.data.go.kr/B551011/Odii
  service-key: ${TOUR_API_SERVICE_KEY}
  mobile-os: ${TOUR_API_MOBILE_OS}
  mobile-app: ${TOUR_API_MOBILE_APP}
