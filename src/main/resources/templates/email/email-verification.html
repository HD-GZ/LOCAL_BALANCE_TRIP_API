<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로컬밸런스 트립 이메일 인증</title>
</head>
<body style="margin:0;padding:0;background-color:#f3f5f7;color:#1f2937;font-family:Arial,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">
    회원가입을 위한 이메일 인증번호를 확인해 주세요.
  </div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background-color:#f3f5f7;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:560px;background-color:#ffffff;border:1px solid #e5e7eb;border-radius:16px;">
          <tr>
            <td style="padding:36px 36px 20px;">
              <p style="margin:0;font-size:15px;font-weight:700;letter-spacing:-0.2px;color:#2F6F4F;">
                LOCAL BALANCE TRIP
              </p>
              <h1 style="margin:18px 0 12px;font-size:26px;line-height:1.4;letter-spacing:-0.7px;color:#111827;">
                이메일 인증번호를 안내드립니다
              </h1>
              <p style="margin:0;font-size:16px;line-height:1.7;color:#4b5563;">
                회원가입을 완료하려면 아래 인증번호를 입력해 주세요.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:4px 36px 28px;">
              <div style="padding:24px;text-align:center;border:1px solid #2F6F4F;border-radius:12px;">
                <p style="margin:0 0 10px;font-size:13px;font-weight:700;color:#2F6F4F;">
                  인증번호
                </p>
                <p style="margin:0;font-family:'Courier New',monospace;font-size:36px;line-height:1.2;font-weight:700;letter-spacing:8px;color:#111827;">
                  {{verificationCode}}
                </p>
              </div>
            </td>
          </tr>
          <tr>
            <td style="padding:0 36px 36px;">
              <div style="height:1px;background-color:#e5e7eb;"></div>
              <p style="margin:20px 0 0;font-size:13px;line-height:1.7;color:#6b7280;">
                본인이 요청하지 않았다면 이 메일을 무시해 주세요.<br>
                보안을 위해 인증번호를 다른 사람에게 공유하지 마세요.
              </p>
            </td>
          </tr>
        </table>
        <p style="margin:18px 0 0;font-size:12px;line-height:1.6;color:#9ca3af;">
          이 메일은 발신 전용입니다. © Local Balance Trip
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
